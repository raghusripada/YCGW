[tool.poetry]
name = "mcp-gateway"
version = "0.1.0"
description = "Python MCP Gateway for protocol translation and API bridging."
authors = ["Your Name <you@example.com>"] # Placeholder, can be updated
readme = "README.md" # Assuming a README will be created

[tool.poetry.dependencies]
python = "^3.9" # Specify Python version compatibility
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
pydantic = "^2.4.2"
aiofiles = "^23.2.1"
# asyncio is part of the standard library, no need to list it here.
# Add other core dependencies as identified, e.g.:
# aiohttp = "^3.8.5"
# redis = "^5.0.1"
# aioredis = "^2.0.1"

[tool.poetry.dev-dependencies]
pytest = "^7.4.2"
pytest-asyncio = "^0.21.1"
# Add other development dependencies like linters, formatters, etc.
# ruff = "^0.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
