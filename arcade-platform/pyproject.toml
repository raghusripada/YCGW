[tool.poetry]
name = "arcade-platform"
version = "0.1.0"
description = "An LLM tool calling platform similar to Arcade.dev."
authors = ["AI Developer <ai@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
pydantic = "^2.4.2"
litellm = "^1.34.0" # Check for latest version
authlib = "^1.2.1" # Check for latest version
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
celery = "^5.3.6"
redis = "^5.0.1"
asyncpg = "^0.29.0" # Check for latest version
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"} # Check for latest version for SQLAlchemy 2.0
httpx = "^0.25.2" # Check for latest version
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9" # For Alembic's default sync operations
Jinja2 = "^3.1.3" # For HTML templates (e.g., login/consent forms)

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-asyncio = "^0.21.1"
ruff = "^0.1.0" # Optional, for linting

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
