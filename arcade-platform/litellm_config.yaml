model_list:
  - model_name: gpt-3.5-turbo # Example, user should replace with their actual models
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY # Instruct user to set this env var
      # You can add other params like temperature, max_tokens if needed as defaults
  - model_name: claude-instant-1.2
    litellm_params:
      model: anthropic/claude-instant-1.2
      api_key: os.environ/ANTHROPIC_API_KEY # Instruct user to set this env var
  # Add more models as needed, e.g., from the issue description
  # - model_name: deepseek
  #   litellm_params:
  #     model: deepseek/deepseek-chat
  #     api_key: os.environ/DEEPSEEK_API_KEY


litellm_settings:
  # drop_params: True # Example: drop params not supported by selected model
  set_verbose: True # Enable LiteLLM verbose logging for debugging
  # success_callback: ["langfuse"] # Example for logging to Langfuse
  # failure_callback: ["langfuse"]
  # cache: # Example for enabling LiteLLM's built-in caching
  #   type: "redis"
  #   host: "os.environ/REDIS_HOST"
  #   port: "os.environ/REDIS_PORT"

# It's good practice to tell users to create a .env file for API keys:
# OPENAI_API_KEY=your_openai_key_here
# ANTHROPIC_API_KEY=your_anthropic_key_here
# DEEPSEEK_API_KEY=your_deepseek_key_here
